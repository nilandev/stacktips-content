name: Update content dates

on:
  push:
    branches: [main]
    paths:
      - "articles/**/*.md"
      - "courses/**/*.md"

permissions:
  contents: write

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save gray-matter

      - name: Update publishedDate / updatedDate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/update-dates.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles courses
          if git diff --cached --quiet; then
            echo "No date changes to commit."
          else
            git commit -m "chore: update publishedDate/updatedDate [skip ci]"
            git push
          fi
