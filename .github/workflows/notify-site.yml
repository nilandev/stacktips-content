name: Notify pages repo of content update

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync in stacktips-site
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.PAGES_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nilandev/stacktips-site/dispatches \
            -d '{"event_type":"content-updated","client_payload":{"sha":"${{ github.sha }}"}}'
